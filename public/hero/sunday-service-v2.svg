<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Sunday Worship Service, 8:00 AM and 10:30 AM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f0f1a"/>
      <stop offset="0.55" stop-color="#b3121f"/>
      <stop offset="1" stop-color="#3a0a0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.4" stop-color="#141416" stop-opacity="0"/>
      <stop offset="1" stop-color="#141416" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <line x1="500" y1="170" x2="-100" y2="-200"/><line x1="500" y1="170" x2="1100" y2="-200"/>
    <line x1="500" y1="170" x2="-200" y2="400"/><line x1="500" y1="170" x2="1200" y2="400"/>
    <line x1="500" y1="170" x2="100" y2="1100"/><line x1="500" y1="170" x2="900" y2="1100"/>
  </g>
  <circle cx="500" cy="170" r="110" fill="none" stroke="#f0c04a" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="500" cy="170" r="170" fill="none" stroke="#f0c04a" stroke-opacity="0.2" stroke-width="2"/>
  <g fill="#f0c04a">
    <rect x="489" y="100" width="22" height="140" rx="3"/>
    <rect x="446" y="138" width="108" height="22" rx="3"/>
  </g>
  <rect width="1000" height="1000" fill="url(#fade)"/>
  <g text-anchor="middle">
    <text x="500" y="390" fill="#f0c04a" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="7">JOIN US THIS SUNDAY</text>
    <g fill="#ffffff" font-family="Impact, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="2">
      <text x="500" y="540">SUNDAY</text>
      <text x="500" y="672">WORSHIP</text>
    </g>
    <text x="500" y="770" fill="#f0c04a" font-family="Impact, 'Arial Narrow', Arial, sans-serif" font-size="60">8:00 AM  ·  10:30 AM</text>
    <text x="500" y="830" fill="#ffffff" fill-opacity="0.85" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="4">WINNERS CHAPEL INTERNATIONAL NASHVILLE</text>
  </g>
</svg>
